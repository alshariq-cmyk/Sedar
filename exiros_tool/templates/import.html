{% extends "base.html" %}
{% block title %}Add files{% endblock %}
{% block content %}
<h1 class="page-title">Add quotation report files</h1>
<p class="sub">You normally don't need this: <strong>Refresh RFQs</strong> collects everything. Use it only for report files you downloaded yourself.</p>
<form method="post" action="/import" enctype="multipart/form-data" class="searchrow">
  <input type="file" name="files" accept=".xls,.xlsx" multiple required>
  <button class="btn">Add</button>
</form>
{% endblock %}
